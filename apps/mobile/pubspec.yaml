name: alpaso
description: "Al Paso: reserva cuartos por horas en hostales y hospedajes de Lima."
publish_to: 'none'

# Versión visible + número de compilación (lo que leen Google Play y App Store).
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.1.0
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  intl: ^0.20.3
  supabase_flutter: ^2.18.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Genera las clases de textos a partir de lib/l10n/*.arb.
  generate: true

  # La tipografía viaja dentro de la app: no se descarga al abrirla.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
