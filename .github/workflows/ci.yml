name: CI

on:
  push:
    branches:
      - main
      - 'etapa-**'
  pull_request:
  workflow_dispatch:

# En main cada commit conserva su resultado; en otras ramas solo importa el
# último.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  app:
    name: App (análisis, pruebas y APK demo)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - name: Versiones
        run: flutter --version

      - name: Dependencias y textos generados
        run: flutter pub get

      - name: Formato
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Análisis
        run: flutter analyze

      - name: Pruebas
        run: flutter test

      - name: APK demo
        run: flutter build apk --debug --dart-define-from-file=config/demo.json

      - uses: actions/upload-artifact@v7
        with:
          name: alpaso-demo-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  db:
    name: Servidor (reglas, permisos y app contra el servidor)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Herramienta de Supabase en la versión fijada
        run: npm ci

      - name: Entorno local con todas las migraciones
        run: npm run server:start

      - name: Pruebas de reglas y permisos
        run: npm run db:test

      - name: Revisión de funciones
        run: npm run db:lint

      - name: Recorrido por la API con cuentas reales
        run: npm run api:smoke

      # La app contra el servidor de verdad: registro, perfil y permisos con el
      # mismo código que corre en el teléfono.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - name: Configuración de la app para el servidor local
        run: npm run app:config:local

      # La misma comprobación que se hace al entorno demo, contra el local.
      - name: Comprobación de servidor demo, contra el local
        run: |
          node -e 'const c=require("./apps/mobile/config/server.local.json"); console.log(c.SUPABASE_PUBLISHABLE_KEY)' > /tmp/key
          node e2e/demo-check.cjs http://127.0.0.1:54321 "$(cat /tmp/key)"

      - name: Pruebas de la app contra el servidor
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter test --tags server --dart-define-from-file=config/server.local.json
