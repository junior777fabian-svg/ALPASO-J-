name: CI

on:
  push:
    branches:
      - main
      - 'etapa-**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: App (análisis, pruebas y APK demo)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - name: Versiones
        run: flutter --version

      - name: Dependencias y textos generados
        run: flutter pub get

      - name: Formato
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Análisis
        run: flutter analyze

      - name: Pruebas
        run: flutter test

      - name: APK demo
        run: flutter build apk --debug --dart-define-from-file=config/demo.json

      - uses: actions/upload-artifact@v7
        with:
          name: alpaso-demo-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  db:
    name: Base de datos (reglas y permisos)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Herramienta de Supabase en la versión fijada
        run: npm ci

      - name: Entorno local con todas las migraciones
        run: npm run server:start

      - name: Pruebas de reglas y permisos
        run: npm run db:test

      - name: Revisión de funciones
        run: npm run db:lint

      - name: Recorrido por la API con cuentas reales
        run: npm run api:smoke
